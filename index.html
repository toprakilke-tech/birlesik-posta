
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birleşik Posta</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141d;color:white;font-family:Arial}
header{padding:22px;background:#191f2b;font-size:23px;font-weight:bold}
.tabs{display:flex;background:#191f2b}
.tabs button{flex:1;padding:17px;border:0;background:none;color:#aaa;font-size:16px}
.tabs button.active{color:#58a6ff;border-bottom:3px solid #58a6ff}
.top{padding:18px;font-size:19px;font-weight:bold}
#notice{text-align:center;color:#65c9a5;padding:12px}
.mail-wrap{position:relative;margin:10px;border-radius:13px;overflow:hidden}
.indicator{position:absolute;top:0;bottom:0;width:100%;display:flex;align-items:center;font-weight:bold;padding:20px;opacity:0}
.left{left:0;justify-content:flex-start;background:#a63e49}
.right{right:0;justify-content:flex-end;background:#287d69}
.mail{position:relative;padding:17px;background:#202938;border-radius:13px;transition:transform .18s ease;touch-action:pan-y}
.mail strong{font-size:16px}
.mail p{color:#c0c8d5;margin:9px 0}
.mail small{color:#8c9aaf}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:12px}
.actions button{border:0;border-radius:8px;padding:8px 12px;color:white;background:#34445b}
.actions .del{background:#a63e49}
</style>
</head>
<body>
<header>✉ Birleşik Posta</header>
<div class="tabs">
<button class="active" onclick="sekme(this,'Tümü')">Tümü</button>
<button onclick="sekme(this,'Gmail')">Gmail</button>
<button onclick="sekme(this,'Outlook')">Outlook</button>
</div>
<div class="top">Gelen Kutusu</div>
<div id="notice">Sağa kaydır: ARŞİV · Sola kaydır: SİL</div>
<div id="liste"></div>
<script>
let mailler=[
{id:1,from:"Ahmet Yılmaz",subject:"Merhaba",body:"Nasılsın? Görüşmeyeli uzun zaman oldu.",date:"Bugün",account:"Gmail"},
{id:2,from:"Microsoft",subject:"Hesap bildirimi",body:"Hesabınızla ilgili yeni bir bilgilendirme.",date:"Dün",account:"Outlook"},
{id:3,from:"İş ve Yaşam",subject:"Haftalık bülten",body:"Bu haftanın yeni haberleri ve duyuruları.",date:"Dün",account:"Gmail"},
{id:4,from:"Arkadaşın",subject:"Fotoğraflar",body:"Geçen gün çektiğimiz fotoğraflar burada.",date:"Pazartesi",account:"Outlook"}
];
let secim="Tümü";

function goster(){
let alan=document.getElementById("liste");
alan.innerHTML="";
mailler.filter(m=>secim==="Tümü"||m.account===secim).forEach(m=>{
let wrap=document.createElement("div");
wrap.className="mail-wrap";
wrap.innerHTML=`
<div class="indicator left">🗑 SİL</div>
<div class="indicator right">▣ ARŞİVLE</div>
<div class="mail">
<strong>${m.from}</strong>
<p>${m.subject}</p>
<small>${m.body}<br>${m.account} · ${m.date}</small>
<div class="actions">
<button onclick="arsiv(${m.id})">Arşivle</button>
<button class="del" onclick="sil(${m.id})">Sil</button>
</div>
</div>`;
let kart=wrap.querySelector(".mail");
let sol=wrap.querySelector(".left");
let sag=wrap.querySelector(".right");
let baslangic=0;

kart.addEventListener("touchstart",e=>{
baslangic=e.touches[0].clientX;
},{passive:true});

kart.addEventListener("touchmove",e=>{
let fark=e.touches[0].clientX-baslangic;
fark=Math.max(-150,Math.min(150,fark));
kart.style.transform=`translateX(${fark}px)`;
sol.style.opacity=fark<0?Math.min(1,Math.abs(fark)/75):0;
sag.style.opacity=fark>0?Math.min(1,fark/75):0;
},{passive:true});

kart.addEventListener("touchend",e=>{
let fark=e.changedTouches[0].clientX-baslangic;
if(fark>85){arsiv(m.id);return}
if(fark< -85){sil(m.id);return}
kart.style.transform="translateX(0)";
sol.style.opacity=0;
sag.style.opacity=0;
});

alan.appendChild(wrap);
});
if(!alan.children.length)alan.innerHTML="<p style='padding:20px;color:#aaa'>Gelen kutusu boş.</p>";
}

function sekme(btn,ad){
secim=ad;
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
goster();
}

function arsiv(id){
mailler=mailler.filter(m=>m.id!==id);
mesaj("E-posta arşivlendi");
goster();
}

function sil(id){
mailler=mailler.filter(m=>m.id!==id);
mesaj("E-posta silindi");
goster();
}

function mesaj(yazi){
document.getElementById("notice").textContent=yazi;
}

goster();
</script>
</body>
</html>
